<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BusReview</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
}

#map {
    width: 100%;
    height: 100%;
}

/* LOGO */

.logo {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 1000;

    background: #080808;
    color: #5271ff;

    padding: 12px 20px;

    border-radius: 15px;

    font-size: 20px;
    font-weight: bold;

    border: 1px solid #222;
}

/* BOTÃO GPS */

.gps {
    position: fixed;

    right: 20px;
    bottom: 330px;

    z-index: 1000;

    width: 52px;
    height: 52px;

    border: none;
    border-radius: 50%;

    background: #5271ff;

    color: white;

    font-size: 21px;

    cursor: pointer;
}

/* PAINEL */

.painel {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    z-index: 2000;

    background: #0b0b0b;

    border-radius: 25px 25px 0 0;

    padding: 20px;

    max-height: 45vh;

    overflow-y: auto;

    box-shadow:
        0 -5px 25px rgba(0,0,0,.7);
}

.titulo {
    font-size: 19px;
    font-weight: bold;

    margin-bottom: 15px;
}

.status-localizacao {
    color: #888;

    font-size: 14px;

    margin-bottom: 15px;
}

/* DESTINOS */

.destinos {
    display: flex;
    gap: 10px;

    overflow-x: auto;

    margin-bottom: 20px;
}

.destino {
    min-width: 95px;

    padding: 12px;

    background: #171717;

    border: 1px solid #292929;

    border-radius: 13px;

    color: white;

    cursor: pointer;
}

.destino:hover {
    background: #5271ff;
}

/* PONTOS */

.subtitulo {
    font-size: 16px;

    font-weight: bold;

    margin-bottom: 10px;
}

.ponto {
    background: #151515;

    border: 1px solid #292929;

    border-radius: 13px;

    padding: 14px;

    margin-bottom: 9px;
}

.ponto-topo {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.ponto-nome {
    font-weight: bold;

    font-size: 15px;
}

.distancia {
    color: #5271ff;

    font-weight: bold;

    font-size: 14px;
}

.linhas {
    color: #999;

    font-size: 13px;

    margin-top: 8px;
}

/* LOADING */

.loading {
    color: #888;

    padding: 15px 0;
}

</style>

</head>

<body>


<div id="map"></div>


<div class="logo">
🚌 BusReview
</div>


<button
class="gps"
onclick="iniciarLocalizacao()">

📍

</button>


<div class="painel">

<div class="titulo">
Para onde você quer ir?
</div>


<div
id="statusLocalizacao"
class="status-localizacao">

Obtendo sua localização...

</div>


<div class="destinos">

<button
class="destino"
onclick="escolherDestino('CEAP')">

🏫
<br>
CEAP

</button>


<button
class="destino"
onclick="escolherDestino('Interlagos')">

📍
<br>
Interlagos

</button>


<button
class="destino"
onclick="escolherDestino('Santo Amaro')">

🏙️
<br>
Santo Amaro

</button>


<button
class="destino"
onclick="escolherDestino('Outro')">

➕
<br>
Outro

</button>

</div>


<div class="subtitulo">

🚏 Pontos de ônibus até 700 m

</div>


<div id="listaPontos">

<div class="loading">

Aguardando localização...

</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ========================================
   MAPA
======================================== */

const map = L.map("map");


L.tileLayer(

"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

{

    attribution:
    '&copy; OpenStreetMap &copy; CARTO',

    subdomains: "abcd",

    maxZoom: 20

}

).addTo(map);


/* Posição inicial enquanto GPS carrega */

map.setView(
[-23.7000, -46.7000],
13
);


/* ========================================
   VARIÁVEIS
======================================== */

let usuarioMarker = null;

let raio700 = null;

let pontosMarkers = [];

let latitudeUsuario = null;

let longitudeUsuario = null;


/* ========================================
   INICIAR GPS
======================================== */

function iniciarLocalizacao() {


    if (!navigator.geolocation) {

        document.getElementById(
            "statusLocalizacao"
        ).innerText =
        "Seu navegador não suporta GPS.";

        return;

    }


    document.getElementById(
        "statusLocalizacao"
    ).innerText =
    "Solicitando sua localização...";


    navigator.geolocation.watchPosition(

        function(position) {

            latitudeUsuario =
            position.coords.latitude;

            longitudeUsuario =
            position.coords.longitude;


            mostrarUsuario();


            buscarPontosDeOnibus();

        },


        function(error) {

            console.log(error);


            document.getElementById(
                "statusLocalizacao"
            ).innerText =
            "Não foi possível acessar sua localização.";

        },


        {

            enableHighAccuracy: true,

            maximumAge: 5000,

            timeout: 15000

        }

    );

}


/* ========================================
   MOSTRAR USUÁRIO
======================================== */

function mostrarUsuario() {


    if (usuarioMarker) {

        map.removeLayer(
            usuarioMarker
        );

    }


    if (raio700) {

        map.removeLayer(
            raio700
        );

    }


    usuarioMarker =

    L.circleMarker(

        [
            latitudeUsuario,
            longitudeUsuario
        ],

        {

            radius: 9,

            color: "white",

            weight: 3,

            fillColor: "#5271ff",

            fillOpacity: 1

        }

    ).addTo(map);


    usuarioMarker.bindPopup(
        "📍 Você está aqui"
    );


    /* RAIO DE 700 METROS */

    raio700 =

    L.circle(

        [
            latitudeUsuario,
            longitudeUsuario
        ],

        {

            radius: 700,

            color: "#5271ff",

            weight: 2,

            fillColor: "#5271ff",

            fillOpacity: 0.07

        }

    ).addTo(map);


    map.setView(

        [
            latitudeUsuario,
            longitudeUsuario
        ],

        15

    );


    document.getElementById(
        "statusLocalizacao"
    ).innerText =

    "📍 Localização encontrada";


}


/* ========================================
   BUSCAR PONTOS REAIS
======================================== */

async function buscarPontosDeOnibus() {


    if (
        latitudeUsuario === null ||
        longitudeUsuario === null
    ) {

        return;

    }


    document.getElementById(
        "listaPontos"
    ).innerHTML =

    '<div class="loading">🔎 Procurando pontos próximos...</div>';


    /*
       Busca pontos de ônibus no OpenStreetMap
       dentro de aproximadamente 700 m.
    */

    const query = `

    [out:json];

    (
        node[
            highway=bus_stop
        ](
            around:700,
            ${latitudeUsuario},
            ${longitudeUsuario}
        );

        node[
            public_transport=platform
        ](
            around:700,
            ${latitudeUsuario},
            ${longitudeUsuario}
        );
    );

    out body;

    `;


    try {


        const resposta =

        await fetch(

            "https://overpass-api.de/api/interpreter",

            {

                method: "POST",

                body: query

            }

        );


        const dados =
        await resposta.json();


        mostrarPontos(dados.elements);


    }

    catch (erro) {

        console.error(erro);


        document.getElementById(
            "listaPontos"
        ).innerHTML =

        `

        <div class="loading">

        Não foi possível carregar os pontos.
        <br><br>
        Verifique sua conexão.

        </div>

        `;

    }

}


/* ========================================
   CALCULAR DISTÂNCIA
======================================== */

function calcularDistancia(

    lat1,
    lon1,
    lat2,
    lon2

) {


    const R = 6371000;


    const dLat =

    (lat2 - lat1) *
    Math.PI / 180;


    const dLon =

    (lon2 - lon1) *
    Math.PI / 180;


    const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(
        lat1 * Math.PI / 180
    )

    *

    Math.cos(
        lat2 * Math.PI / 180
    )

    *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


    const c =

    2 *

    Math.atan2(

        Math.sqrt(a),

        Math.sqrt(1 - a)

    );


    return R * c;

}


/* ========================================
   MOSTRAR PONTOS
======================================== */

function mostrarPontos(
    pontos
) {


    /* Remove marcadores antigos */

    pontosMarkers.forEach(

        marker => {

            map.removeLayer(marker);

        }

    );


    pontosMarkers = [];


    const lista =

    document.getElementById(
        "listaPontos"
    );


    lista.innerHTML = "";


    if (!pontos.length) {


        lista.innerHTML =

        `

        <div class="loading">

        Nenhum ponto encontrado
        dentro de 700 metros.

        </div>

        `;

        return;

    }


    /* Organiza pela distância */

    pontos.sort(

        (a, b) => {

            const distanciaA =

            calcularDistancia(

                latitudeUsuario,
                longitudeUsuario,

                a.lat,
                a.lon

            );


            const distanciaB =

            calcularDistancia(

                latitudeUsuario,
                longitudeUsuario,

                b.lat,
                b.lon

            );


            return distanciaA - distanciaB;

        }

    );


    /* Mostra cada ponto */

    pontos.forEach(

        (ponto, index) => {


            const distancia =

            calcularDistancia(

                latitudeUsuario,
                longitudeUsuario,

                ponto.lat,
                ponto.lon

            );


            /*
               Segurança:
               somente pontos <= 700 m
            */

            if (distancia > 700) {

                return;

            }


            const nome =

            ponto.tags &&
            (
                ponto.tags.name ||
                ponto.tags["official_name"]
            )

            ||

            "Ponto de ônibus";


            /* MARCADOR NO MAPA */

            const marker =

            L.circleMarker(

                [
                    ponto.lat,
                    ponto.lon
                ],

                {

                    radius: 8,

                    color: "white",

                    weight: 2,

                    fillColor: "#5271ff",

                    fillOpacity: 1

                }

            ).addTo(map);


            marker.bindPopup(

                `

                <b>🚏 ${nome}</b>

                <br><br>

                📍 ${Math.round(distancia)} metros de você

                `

            );


            pontosMarkers.push(
                marker
            );


            /* CARD */

            const card =

            document.createElement(
                "div"
            );


            card.className =
            "ponto";


            card.onclick =

            function() {

                map.setView(

                    [
                        ponto.lat,
                        ponto.lon
                    ],

                    17

                );

                marker.openPopup();

            };


            card.innerHTML =

            `

            <div class="ponto-topo">

                <div class="ponto-nome">

                    🚏 ${nome}

                </div>

                <div class="distancia">

                    ${Math.round(distancia)} m

                </div>

            </div>

            <div class="linhas">

                Clique para ver este ponto no mapa

            </div>

            `;


            lista.appendChild(
                card
            );

        }

    );

}


/* ========================================
   DESTINO
======================================== */

function escolherDestino(
    destino
) {

    alert(

        "Destino escolhido: " +
        destino +

        "\n\nAgora podemos mostrar as linhas que passam pelos pontos próximos e levam até esse destino."

    );

}


/* ========================================
   INICIAR AUTOMATICAMENTE
======================================== */

iniciarLocalizacao();

</script>

</body>

</html>
