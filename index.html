<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusReview</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            font-family: Arial, sans-serif;
        }

        .titulo {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 1000;

            background: #080808;
            color: #5271ff;

            padding: 12px 22px;

            border-radius: 14px;
            border: 1px solid #222;

            font-size: 20px;
            font-weight: bold;
        }

        .localizacao {
            position: absolute;
            right: 20px;
            bottom: 25px;

            z-index: 1000;

            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: #5271ff;
            color: white;

            font-size: 23px;

            cursor: pointer;
        }

        .status {
            position: absolute;
            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            z-index: 1000;

            background: #080808;
            color: white;

            padding: 10px 16px;

            border-radius: 10px;

            font-size: 14px;

            display: none;
        }

        .bus-stop-icon {
            background: #5271ff;
            border: 3px solid white;
            border-radius: 50%;

            width: 18px;
            height: 18px;
        }

    </style>

</head>

<body>

    <div class="titulo">
        🚌 BusReview
    </div>

    <button
        class="localizacao"
        onclick="localizarUsuario()">
        📍
    </button>

    <div id="status" class="status"></div>

    <div id="map"></div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        // ==========================================
        // CONFIGURAÇÕES
        // ==========================================

        const RAIO = 2000;

        let usuarioMarker = null;

        let circulo = null;

        let marcadores = [];


        // ==========================================
        // MAPA
        // ==========================================

        const map = L.map("map");

        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
            {
                attribution:
                    '&copy; OpenStreetMap &copy; CARTO',

                subdomains: "abcd",

                maxZoom: 20
            }
        ).addTo(map);


        // ==========================================
        // STATUS
        // ==========================================

        function mostrarStatus(texto) {

            const status =
                document.getElementById("status");

            status.innerText = texto;

            status.style.display = "block";

        }


        // ==========================================
        // LOCALIZAÇÃO
        // ==========================================

        function localizarUsuario() {

            if (!navigator.geolocation) {

                mostrarStatus(
                    "Seu navegador não suporta localização."
                );

                return;
            }

            mostrarStatus(
                "📍 Procurando sua localização..."
            );


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const lat =
                        position.coords.latitude;

                    const lon =
                        position.coords.longitude;


                    mostrarUsuario(lat, lon);

                    buscarPontos(lat, lon);

                },

                function() {

                    mostrarStatus(
                        "⚠️ Permita o acesso à localização."
                    );

                },

                {
                    enableHighAccuracy: true,

                    timeout: 15000,

                    maximumAge: 0
                }

            );

        }


        // ==========================================
        // MOSTRAR USUÁRIO
        // ==========================================

        function mostrarUsuario(lat, lon) {

            if (usuarioMarker) {

                map.removeLayer(
                    usuarioMarker
                );

            }


            if (circulo) {

                map.removeLayer(
                    circulo
                );

            }


            usuarioMarker =
                L.circleMarker(

                    [lat, lon],

                    {
                        radius: 9,

                        color: "white",

                        weight: 3,

                        fillColor: "#5271ff",

                        fillOpacity: 1
                    }

                ).addTo(map);


            usuarioMarker.bindPopup(
                "<b>📍 Você está aqui</b>"
            );


            // Raio de 2 km

            circulo =
                L.circle(

                    [lat, lon],

                    {
                        radius: RAIO,

                        color: "#5271ff",

                        weight: 2,

                        fillColor: "#5271ff",

                        fillOpacity: 0.08
                    }

                ).addTo(map);


            map.setView(
                [lat, lon],
                14
            );

        }


        // ==========================================
        // BUSCAR PONTOS
        // ==========================================

        async function buscarPontos(lat, lon) {

            mostrarStatus(
                "🚌 Procurando pontos de ônibus..."
            );


            // Consulta do OpenStreetMap

            const consulta = `

                [out:json][timeout:25];

                (
                    node
                    ["highway"="bus_stop"]
                    (around:${RAIO},${lat},${lon});

                    node
                    ["public_transport"="platform"]
                    ["bus"="yes"]
                    (around:${RAIO},${lat},${lon});

                );

                out body;

            `;


            // Servidores alternativos

            const servidores = [

                "https://overpass-api.de/api/interpreter",

                "https://overpass.kumi.systems/api/interpreter",

                "https://overpass.private.coffee/api/interpreter"

            ];


            let dados = null;


            // Tenta cada servidor

            for (const servidor of servidores) {

                try {

                    console.log(
                        "Tentando:",
                        servidor
                    );


                    const resposta =
                        await fetch(

                            servidor,

                            {
                                method: "POST",

                                body: consulta
                            }

                        );


                    if (!resposta.ok) {

                        continue;

                    }


                    dados =
                        await resposta.json();


                    break;

                }

                catch (erro) {

                    console.log(
                        "Servidor falhou:",
                        servidor
                    );

                }

            }


            // Nenhum servidor respondeu

            if (!dados) {

                mostrarStatus(
                    "❌ Não foi possível carregar os pontos."
                );

                return;

            }


            // Apaga marcadores anteriores

            marcadores.forEach(

                function(marker) {

                    map.removeLayer(marker);

                }

            );

            marcadores = [];


            // ======================================
            // CRIAR MARCADORES
            // ======================================

            dados.elements.forEach(

                function(ponto) {

                    if (
                        !ponto.lat ||
                        !ponto.lon
                    ) {

                        return;

                    }


                    const nome =
                        ponto.tags?.name
                        || "Ponto de ônibus";


                    const ref =
                        ponto.tags?.ref
                        || "";


                    const marker =
                        L.circleMarker(

                            [
                                ponto.lat,
                                ponto.lon
                            ],

                            {
                                radius: 8,

                                color: "white",

                                weight: 2,

                                fillColor: "#5271ff",

                                fillOpacity: 1
                            }

                        ).addTo(map);


                    marker.bindPopup(`

                        <div style="
                            min-width:180px;
                            color:#111;
                        ">

                            <h3>
                                🚌 ${nome}
                            </h3>

                            ${
                                ref
                                ?
                                `<p>
                                    <b>Referência:</b>
                                    ${ref}
                                </p>`
                                :
                                ""
                            }

                            <hr>

                            <p>
                                📍 Ponto de ônibus
                            </p>

                            <p>
                                ⏱️ Horários:
                                <b>em breve</b>
                            </p>

                        </div>

                    `);


                    marcadores.push(
                        marker
                    );

                }

            );


            // Resultado

            const quantidade =
                marcadores.length;


            if (quantidade === 0) {

                mostrarStatus(
                    "⚠️ Nenhum ponto encontrado nos 2 km."
                );

            }

            else {

                mostrarStatus(
                    `🚌 ${quantidade} pontos encontrados em 2 km`
                );

            }

        }


        // ==========================================
        // POSIÇÃO INICIAL
        // ==========================================

        map.setView(

            [-23.7000, -46.7000],

            13

        );


        // ==========================================
        // INICIA
        // ==========================================

        localizarUsuario();

    </script>

</body>

</html>
