<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusReview</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
        }

        body {
            overflow: hidden;
        }

        /* =========================
           MAPA
        ========================= */

        #map {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            position: absolute;

            top: 15px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 1000;

            background: #080808;

            color: #5271ff;

            padding: 12px 22px;

            border-radius: 15px;

            font-size: 21px;
            font-weight: bold;

            border: 1px solid #222;

            box-shadow:
                0 4px 15px rgba(0,0,0,.6);
        }


        /* =========================
           BOTÃO LOCALIZAÇÃO
        ========================= */

        .localizar {

            position: absolute;

            right: 20px;
            bottom: 330px;

            z-index: 1000;

            width: 52px;
            height: 52px;

            border: none;

            border-radius: 50%;

            background: #5271ff;

            color: white;

            font-size: 21px;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(0,0,0,.6);
        }


        /* =========================
           PAINEL INFERIOR
        ========================= */

        .painel {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            z-index: 2000;

            background: #0b0b0b;

            border-radius: 25px 25px 0 0;

            padding: 22px 18px 25px;

            box-shadow:
                0 -5px 25px rgba(0,0,0,.65);

            max-height: 48vh;

            overflow-y: auto;
        }


        /* =========================
           BUSCA
        ========================= */

        .titulo {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        .destinos {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            margin-bottom: 22px;
        }


        .destino {

            min-width: 95px;

            padding: 12px;

            background: #171717;

            border: 1px solid #292929;

            border-radius: 13px;

            color: white;

            cursor: pointer;

            text-align: center;

            font-size: 14px;
        }


        .destino:hover {

            background: #5271ff;

            border-color: #5271ff;
        }


        /* =========================
           LINHAS PRÓXIMAS
        ========================= */

        .subtitulo {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .linha-card {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 14px;

            margin-bottom: 9px;

            background: #151515;

            border: 1px solid #282828;

            border-radius: 13px;

            cursor: pointer;

            transition: .15s;
        }


        .linha-card:hover {

            background: #202020;

            transform: translateY(-1px);
        }


        .linha-esquerda {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .status {

            width: 11px;
            height: 11px;

            border-radius: 50%;
        }


        .verde {
            background: #35d05b;
        }


        .amarelo {
            background: #f4c542;
        }


        .vermelho {
            background: #e84b4b;
        }


        .codigo {

            font-size: 16px;

            font-weight: bold;
        }


        .tempo {

            font-weight: bold;

            color: #55d66b;
        }


        /* =========================
           TELA DA LINHA
        ========================= */

        .detalhes {

            position: fixed;

            inset: 0;

            z-index: 3000;

            background: #090909;

            padding: 25px;

            display: none;

            overflow-y: auto;
        }


        .voltar {

            border: none;

            background: #181818;

            color: white;

            border-radius: 10px;

            padding: 10px 15px;

            cursor: pointer;

            margin-bottom: 25px;
        }


        .linha-titulo {

            font-size: 30px;

            color: #5271ff;

            margin-bottom: 8px;
        }


        .operacao {

            display: inline-block;

            padding: 7px 12px;

            border-radius: 20px;

            background: #12351b;

            color: #55d66b;

            margin-bottom: 25px;
        }


        /* =========================
           INFORMAÇÕES
        ========================= */

        .info-box {

            background: #151515;

            border: 1px solid #292929;

            border-radius: 15px;

            padding: 18px;

            margin-bottom: 12px;
        }


        .info-label {

            color: #999;

            font-size: 13px;

            margin-bottom: 7px;
        }


        .info-value {

            font-size: 22px;

            font-weight: bold;
        }


        .confiabilidade {

            color: #55d66b;
        }


        .lotacao {

            color: #f4c542;
        }


        /* =========================
           BOTÕES
        ========================= */

        .acao {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            background: #5271ff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .acao-secundaria {

            background: #1b1b1b;

            border: 1px solid #333;
        }


        .acao:hover {

            opacity: .9;
        }


        /* =========================
           MARCADORES DO MAPA
        ========================= */

        .icone-onibus {

            background: #5271ff;

            width: 32px;
            height: 32px;

            border-radius: 50%;

            border: 3px solid white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 15px;
        }

    </style>

</head>


<body>


<!-- =========================
     MAPA
========================= -->

<div id="map"></div>


<!-- =========================
     LOGO
========================= -->

<div class="logo">
    🚌 BusReview
</div>


<!-- =========================
     BOTÃO GPS
========================= -->

<button
    class="localizar"
    onclick="localizarUsuario()">

    📍

</button>


<!-- =========================
     PAINEL
========================= -->

<div class="painel">


    <div class="titulo">
        Para onde você quer ir?
    </div>


    <div class="destinos">

        <button
            class="destino"
            onclick="selecionarDestino('Casa')">

            🏠<br>
            Casa

        </button>


        <button
            class="destino"
            onclick="selecionarDestino('CEAP')">

            🏫<br>
            CEAP

        </button>


        <button
            class="destino"
            onclick="selecionarDestino('Outro')">

            ➕<br>
            Outro

        </button>

    </div>


    <div class="subtitulo">
        Linhas próximas
    </div>


    <!-- LINHA 675A -->

    <div
        class="linha-card"
        onclick="abrirLinha('675A')"
    >

        <div class="linha-esquerda">

            <div class="status verde"></div>

            <div class="codigo">
                675A
            </div>

        </div>

        <div class="tempo">
            6 min
        </div>

    </div>


    <!-- LINHA 6021 -->

    <div
        class="linha-card"
        onclick="abrirLinha('6021')"
    >

        <div class="linha-esquerda">

            <div class="status amarelo"></div>

            <div class="codigo">
                6021
            </div>

        </div>

        <div class="tempo">
            11 min
        </div>

    </div>


    <!-- LINHA 637V -->

    <div
        class="linha-card"
        onclick="abrirLinha('637V')"
    >

        <div class="linha-esquerda">

            <div class="status vermelho"></div>

            <div class="codigo">
                637V
            </div>

        </div>

        <div class="tempo">
            18 min
        </div>

    </div>

</div>


<!-- =========================
     DETALHES DA LINHA
========================= -->

<div
    id="detalhes"
    class="detalhes"
>


    <button
        class="voltar"
        onclick="fecharLinha()">

        ← Voltar

    </button>


    <h1
        id="linhaTitulo"
        class="linha-titulo">

        675A

    </h1>


    <div
        id="linhaOperacao"
        class="operacao">

        🟢 Operação normal

    </div>


    <!-- PRÓXIMO ÔNIBUS -->

    <div class="info-box">

        <div class="info-label">
            Próximo ônibus
        </div>

        <div
            id="proximo"
            class="info-value">

            6 min

        </div>

    </div>


    <!-- CONFIABILIDADE -->

    <div class="info-box">

        <div class="info-label">
            Confiabilidade
        </div>

        <div
            id="confiabilidade"
            class="info-value confiabilidade">

            96%

        </div>

    </div>


    <!-- LOTAÇÃO -->

    <div class="info-box">

        <div class="info-label">
            Lotação
        </div>

        <div
            id="lotacao"
            class="info-value lotacao">

            🟡 Cheio

        </div>

    </div>


    <!-- HORÁRIO DE PICO -->

    <div class="info-box">

        <div class="info-label">
            Horário de pico
        </div>

        <div
            id="pico"
            class="info-value">

            06:40 – 08:10

        </div>

    </div>


    <!-- ACOMPANHAR -->

    <button
        class="acao"
        onclick="acompanharLinha()">

        📍 Acompanhar ônibus

    </button>


    <!-- AVALIAÇÃO -->

    <button
        class="acao acao-secundaria"
        onclick="avaliarLinha()">

        ⭐ Como está a linha?

    </button>


</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


    // ==========================================
    // MAPA
    // ==========================================

    const map =
        L.map("map");


    L.tileLayer(

        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

        {

            attribution:
                '&copy; OpenStreetMap &copy; CARTO',

            subdomains: "abcd",

            maxZoom: 20

        }

    ).addTo(map);


    // Posição inicial

    map.setView(

        [-23.7000, -46.7000],

        13

    );


    // ==========================================
    // DADOS DAS LINHAS
    // ==========================================

    const linhas = {

        "675A": {

            tempo: "6 min",

            confiabilidade: "96%",

            lotacao: "🟡 Cheio",

            pico: "06:40 – 08:10",

            status: "🟢 Operação normal"

        },

        "6021": {

            tempo: "11 min",

            confiabilidade: "88%",

            lotacao: "🟢 Normal",

            pico: "06:30 – 08:00",

            status: "🟡 Operação com atenção"

        },

        "637V": {

            tempo: "18 min",

            confiabilidade: "71%",

            lotacao: "🔴 Muito cheio",

            pico: "06:20 – 08:20",

            status: "🔴 Possíveis atrasos"

        }

    };


    // ==========================================
    // LOCALIZAÇÃO
    // ==========================================

    let marcadorUsuario = null;

    let circulo = null;


    function localizarUsuario() {


        if (!navigator.geolocation) {

            alert(
                "Seu navegador não suporta localização."
            );

            return;

        }


        navigator.geolocation.watchPosition(

            function(position) {


                const lat =
                    position.coords.latitude;


                const lon =
                    position.coords.longitude;


                // Remove marcador anterior

                if (marcadorUsuario) {

                    map.removeLayer(
                        marcadorUsuario
                    );

                }


                // Remove círculo anterior

                if (circulo) {

                    map.removeLayer(
                        circulo
                    );

                }


                // Cria marcador

                marcadorUsuario =
                    L.circleMarker(

                        [lat, lon],

                        {

                            radius: 9,

                            color: "white",

                            weight: 3,

                            fillColor: "#5271ff",

                            fillOpacity: 1

                        }

                    ).addTo(map);


                marcadorUsuario.bindPopup(
                    "<b>📍 Você está aqui</b>"
                );


                // Raio de 2 km

                circulo =
                    L.circle(

                        [lat, lon],

                        {

                            radius: 2000,

                            color: "#5271ff",

                            fillColor: "#5271ff",

                            fillOpacity: 0.06

                        }

                    ).addTo(map);


                map.setView(

                    [lat, lon],

                    14

                );

            },


            function(error) {

                console.log(
                    "Erro GPS:",
                    error
                );

            },


            {

                enableHighAccuracy: true,

                maximumAge: 5000,

                timeout: 15000

            }

        );

    }


    // ==========================================
    // SELECIONAR DESTINO
    // ==========================================

    function selecionarDestino(
        destino
    ) {

        alert(
            "Destino selecionado: " +
            destino
        );

    }


    // ==========================================
    // ABRIR LINHA
    // ==========================================

    function abrirLinha(
        codigo
    ) {


        const dados =
            linhas[codigo];


        if (!dados) {

            return;

        }


        document.getElementById(
            "linhaTitulo"
        ).innerText =
            codigo;


        document.getElementById(
            "linhaOperacao"
        ).innerText =
            dados.status;


        document.getElementById(
            "proximo"
        ).innerText =
            dados.tempo;


        document.getElementById(
            "confiabilidade"
        ).innerText =
            dados.confiabilidade;


        document.getElementById(
            "lotacao"
        ).innerText =
            dados.lotacao;


        document.getElementById(
            "pico"
        ).innerText =
            dados.pico;


        document.getElementById(
            "detalhes"
        ).style.display =
            "block";

    }


    // ==========================================
    // FECHAR LINHA
    // ==========================================

    function fecharLinha() {

        document.getElementById(
            "detalhes"
        ).style.display =
            "none";

    }


    // ==========================================
    // ACOMPANHAR ÔNIBUS
    // ==========================================

    function acompanharLinha() {

        alert(
            "Acompanhamento ativado!"
        );

    }


    // ==========================================
    // AVALIAR LINHA
    // ==========================================

    function avaliarLinha() {

        alert(
            "Aqui entrará o sistema de avaliação da linha."
        );

    }


    // ==========================================
    // INICIAR GPS
    // ==========================================

    localizarUsuario();


</script>

</body>

</html>
