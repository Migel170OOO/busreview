<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BusReview</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Nosso CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- MAPA -->

    <div id="map"></div>


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            🚌
        </div>

        <div>
            BusReview
        </div>

    </div>


    <!-- INFORMAÇÃO SOBRE O RAIO -->

    <div class="radius-info">

        <span class="location-dot"></span>

        Pontos em até 2 km

    </div>


    <!-- BOTÃO DE LOCALIZAÇÃO -->

    <button
        id="locationButton"
        class="location-button"
        onclick="centralizarUsuario()"
    >

        📍

    </button>


    <!-- PAINEL DO PONTO -->

    <section
        id="busPanel"
        class="bus-panel"
    >

        <div class="panel-handle"></div>


        <button
            class="close-button"
            onclick="fecharPainel()"
        >

            ×

        </button>


        <div class="panel-header">

            <div>

                <div
                    id="selectedStopName"
                    class="stop-name"
                >
                    Ponto de ônibus
                </div>

                <div
                    id="selectedStopDistance"
                    class="stop-distance"
                >
                    Selecione um ponto no mapa
                </div>

            </div>

        </div>


        <div class="arrivals-title">

            Próximos ônibus

        </div>


        <div
            id="arrivals"
            class="arrivals"
        >

            <!-- preenchido pelo JavaScript -->

        </div>


        <div class="simulation-warning">

            Os horários mostrados nesta versão
            são simulados.

        </div>

    </section>


    <!-- LEAFLET -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- NOSSO JAVASCRIPT -->

    <script src="app.js"></script>


</body>

</html>
