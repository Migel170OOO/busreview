<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusReview</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
        }

        #map {
            background: #111;
        }

        .logo {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            background: #080808;
            color: #5271ff;

            padding: 12px 22px;
            border-radius: 15px;

            font-size: 21px;
            font-weight: bold;

            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,.6);
        }

        .localizar {
            position: absolute;
            right: 20px;
            bottom: 25px;
            z-index: 1000;

            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: #5271ff;
            color: white;

            font-size: 22px;
            cursor: pointer;

            box-shadow: 0 4px 15px rgba(0,0,0,.6);
        }

        .painel {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);

            width: 92%;
            max-width: 420px;

            background: #111;
            color: white;

            border-radius: 18px;
            padding: 20px;

            z-index: 2000;

            box-shadow: 0 5px 25px rgba(0,0,0,.8);

            display: none;
        }

        .painel h2 {
            color: #5271ff;
            margin-bottom: 8px;
        }

        .linha {
            background: #1c1c1c;
            border: 1px solid #292929;

            border-radius: 12px;

            padding: 14px;
            margin-top: 10px;

            cursor: pointer;
        }

        .linha:hover {
            background: #252525;
        }

        .tempo {
            color: #55d66b;
            font-weight: bold;
        }

        .fechar {
            position: absolute;
            right: 15px;
            top: 12px;

            border: none;
            background: none;

            color: white;
            font-size: 22px;

            cursor: pointer;
        }

        .botao {
            width: 100%;

            margin-top: 15px;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #5271ff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .opcao {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .opcao button {
            flex: 1;

            padding: 10px;

            border: 1px solid #333;
            border-radius: 9px;

            background: #1b1b1b;
            color: white;

            cursor: pointer;
        }

        .opcao button:hover {
            background: #5271ff;
        }
    </style>
</head>

<body>

<div class="logo">🚌 BusReview</div>

<button class="localizar" onclick="localizarUsuario()">📍</button>

<div id="map"></div>

<div id="painel" class="painel">
    <button class="fechar" onclick="fecharPainel()">×</button>
    <div id="conteudo"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // ==========================================
    // MAPA
    // ==========================================

    const map = L.map("map");

    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            attribution:
                '&copy; OpenStreetMap &copy; CARTO',
            subdomains: "abcd",
            maxZoom: 20
        }
    ).addTo(map);

    map.setView(
        [-23.7000, -46.7000],
        13
    );


    // ==========================================
    // VARIÁVEIS
    // ==========================================

    let marcadorUsuario = null;
    let circulo = null;
    let marcadoresPontos = [];


    // ==========================================
    // LOCALIZAÇÃO
    // ==========================================

    function localizarUsuario() {

        if (!navigator.geolocation) {
            alert("Seu navegador não suporta localização.");
            return;
        }

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                mostrarUsuario(lat, lon);

                buscarPontos(lat, lon);
            },

            function() {

                alert(
                    "Não foi possível acessar sua localização."
                );

            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }


    // ==========================================
    // MOSTRAR USUÁRIO
    // ==========================================

    function mostrarUsuario(lat, lon) {

        if (marcadorUsuario) {
            map.removeLayer(marcadorUsuario);
        }

        if (circulo) {
            map.removeLayer(circulo);
        }

        marcadorUsuario = L.circleMarker(
            [lat, lon],
            {
                radius: 9,
                color: "white",
                weight: 3,
                fillColor: "#5271ff",
                fillOpacity: 1
            }
        ).addTo(map);

        marcadorUsuario.bindPopup(
            "<b>📍 Você está aqui</b>"
        );

        circulo = L.circle(
            [lat, lon],
            {
                radius: 2000,
                color: "#5271ff",
                weight: 2,
                fillColor: "#5271ff",
                fillOpacity: 0.08
            }
        ).addTo(map);

        map.setView(
            [lat, lon],
            14
        );
    }


    // ==========================================
    // BUSCAR PONTOS DE ÔNIBUS
    // ==========================================

    async function buscarPontos(lat, lon) {

        const consulta = `

            [out:json][timeout:25];

            (
                node
                ["highway"="bus_stop"]
                (around:2000,${lat},${lon});

                node
                ["public_transport"="platform"]
                ["bus"="yes"]
                (around:2000,${lat},${lon});
            );

            out body;

        `;

        const servidores = [

            "https://overpass-api.de/api/interpreter",

            "https://overpass.kumi.systems/api/interpreter",

            "https://overpass.private.coffee/api/interpreter"

        ];

        let dados = null;

        for (const servidor of servidores) {

            try {

                const resposta = await fetch(
                    servidor,
                    {
                        method: "POST",
                        body: consulta
                    }
                );

                if (resposta.ok) {
                    dados = await resposta.json();
                    break;
                }

            } catch (erro) {
                console.log(
                    "Servidor indisponível:",
                    servidor
                );
            }
        }

        if (!dados) {
            alert(
                "Não foi possível carregar os pontos de ônibus."
            );
            return;
        }


        // Remove pontos antigos

        marcadoresPontos.forEach(
            marker => map.removeLayer(marker)
        );

        marcadoresPontos = [];


        // Cria os pontos

        dados.elements.forEach(ponto => {

            if (!ponto.lat || !ponto.lon) {
                return;
            }

            const nome =
                ponto.tags?.name ||
                "Ponto de ônibus";


            const marker = L.circleMarker(
                [ponto.lat, ponto.lon],
                {
                    radius: 8,
                    color: "white",
                    weight: 2,
                    fillColor: "#5271ff",
                    fillOpacity: 1
                }
            ).addTo(map);


            marker.on(
                "click",
                function() {
                    abrirPonto(nome);
                }
            );


            marcadoresPontos.push(marker);

        });
    }


    // ==========================================
    // ABRIR PONTO
    // ==========================================

    function abrirPonto(nome) {

        const painel =
            document.getElementById("painel");

        const conteudo =
            document.getElementById("conteudo");

        conteudo.innerHTML = `

            <h2>🚌 ${nome}</h2>

            <p>
                Linhas disponíveis neste ponto:
            </p>

            <div
                class="linha"
                onclick="abrirLinha('675A-10', 'Terminal Santo Amaro', 4)"
            >
                <b>675A-10</b>

                <br>

                → Terminal Santo Amaro

                <br><br>

                <span class="tempo">
                    🟢 Chega em 4 min
                </span>
            </div>

            <div
                class="linha"
                onclick="abrirLinha('607C-10', 'Terminal Grajaú', 11)"
            >
                <b>607C-10</b>

                <br>

                → Terminal Grajaú

                <br><br>

                <span class="tempo">
                    🟢 Chega em 11 min
                </span>
            </div>

            <div
                class="linha"
                onclick="abrirLinha('6000-10', 'Terminal Santo Amaro', 17)"
            >
                <b>6000-10</b>

                <br>

                → Terminal Santo Amaro

                <br><br>

                <span class="tempo">
                    🟡 Chega em 17 min
                </span>
            </div>
        `;

        painel.style.display = "block";
    }


    // ==========================================
    // ABRIR LINHA
    // ==========================================

    function abrirLinha(
        codigo,
        destino,
        tempo
    ) {

        const conteudo =
            document.getElementById("conteudo");

        conteudo.innerHTML = `

            <h2>🚌 ${codigo}</h2>

            <p>
                <b>Destino:</b>
                ${destino}
            </p>

            <p style="margin-top:10px">
                <b>Próximo ônibus:</b>
                <span class="tempo">
                    ${tempo} minutos
                </span>
            </p>

            <p style="margin-top:10px">
                🟢 Operação normal
            </p>

            <button
                class="botao"
                onclick="abrirAvaliacao('${codigo}')"
            >
                ⭐ Avaliar viagem
            </button>
        `;
    }


    // ==========================================
    // AVALIAÇÃO
    // ==========================================

    function abrirAvaliacao(codigo) {

        const conteudo =
            document.getElementById("conteudo");

        conteudo.innerHTML = `

            <h2>⭐ Avaliar ${codigo}</h2>

            <p>
                Como estava o ônibus?
            </p>

            <div class="opcao">

                <button
                    onclick="selecionar('lotacao', 'Normal')"
                >
                    🟢 Normal
                </button>

                <button
                    onclick="selecionar('lotacao', 'Cheio')"
                >
                    🟡 Cheio
                </button>

                <button
                    onclick="selecionar('lotacao', 'Muito cheio')"
                >
                    🔴 Muito cheio
                </button>

            </div>

            <br>

            <p>
                Você conseguiu embarcar?
            </p>

            <div class="opcao">

                <button
                    onclick="selecionar('embarque', 'Sim')"
                >
                    Sim
                </button>

                <button
                    onclick="selecionar('embarque', 'Não')"
                >
                    Não
                </button>

            </div>

            <br>

            <p>
                Houve atraso?
            </p>

            <div class="opcao">

                <button
                    onclick="selecionar('atraso', 'Não')"
                >
                    Não
                </button>

                <button
                    onclick="selecionar('atraso', 'Sim')"
                >
                    Sim
                </button>

            </div>

            <button
                class="botao"
                onclick="enviarAvaliacao()"
            >
                Enviar avaliação
            </button>
        `;
    }


    // ==========================================
    // SELEÇÃO
    // ==========================================

    let avaliacao = {};

    function selecionar(tipo, valor) {

        avaliacao[tipo] = valor;

    }


    // ==========================================
    // ENVIAR AVALIAÇÃO
    // ==========================================

    function enviarAvaliacao() {

        if (
            !avaliacao.lotacao ||
            !avaliacao.embarque ||
            !avaliacao.atraso
        ) {

            alert(
                "Responda todas as perguntas."
            );

            return;
        }

        alert(
            "Avaliação enviada com sucesso!"
        );

        avaliacao = {};

        fecharPainel();
    }


    // ==========================================
    // FECHAR PAINEL
    // ==========================================

    function fecharPainel() {

        document.getElementById(
            "painel"
        ).style.display = "none";
    }


    // ==========================================
    // INICIAR
    // ==========================================

    localizarUsuario();

</script>

</body>
</html>
