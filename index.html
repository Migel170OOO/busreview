<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa Interativo do Brasil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Mapa Interativo do Brasil</h1>
            <p>Explore os estados brasileiros</p>
        </div>
    </header>

    <main class="container">

        <section class="map-section">

            <div class="map-container">

                <div class="map-placeholder">
                    <h2>Mapa do Brasil</h2>
                    <p>O mapa interativo será inserido aqui.</p>
                </div>

            </div>

            <aside class="info-panel">

                <h2>Selecione um estado</h2>

                <p>
                    Clique em um estado do mapa para visualizar
                    suas informações.
                </p>

                <div id="state-info">
                    <strong>Nenhum estado selecionado</strong>
                </div>

            </aside>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
