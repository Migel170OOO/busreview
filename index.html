<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa do Brasil</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // Limites aproximadas do Brasil
    const brasilBounds = [
        [-34.0, -74.0], // sudoeste
        [5.5, -32.0]    // nordeste
    ];

    // Cria o mapa
    const map = L.map('map', {

        // Impede sair da área do Brasil
        maxBounds: brasilBounds,

        // Quanto pode afastar
        minZoom: 4,

        // Quanto pode aproximar
        maxZoom: 18
    });

    // Mapa base
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // Centraliza no Brasil
    map.fitBounds(brasilBounds);

</script>

</body>
</html>
