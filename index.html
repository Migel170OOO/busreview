<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusReview</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
        }

        #map {
            background: #111;
        }

        .logo {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 1000;

            background: #080808;
            color: #5271ff;

            padding: 12px 22px;
            border-radius: 15px;

            font-size: 21px;
            font-weight: bold;

            border: 1px solid #222;
        }

        .localizar {
            position: absolute;
            right: 20px;
            bottom: 25px;

            z-index: 1000;

            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: #5271ff;
            color: white;

            font-size: 22px;
            cursor: pointer;
        }

        .painel {
            position: absolute;

            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            width: 92%;
            max-width: 430px;

            background: #111;
            color: white;

            border-radius: 18px;

            padding: 20px;

            z-index: 2000;

            box-shadow: 0 5px 25px rgba(0,0,0,.8);

            display: none;

            max-height: 75vh;
            overflow-y: auto;
        }

        .painel h2 {
            color: #5271ff;
            margin-bottom: 10px;
        }

        .fechar {
            position: absolute;

            right: 15px;
            top: 10px;

            border: none;
            background: none;

            color: white;

            font-size: 25px;

            cursor: pointer;
        }

        .linha {
            background: #1c1c1c;

            border: 1px solid #292929;

            border-radius: 12px;

            padding: 14px;

            margin-top: 10px;

            cursor: pointer;
        }

        .linha:hover {
            background: #252525;
        }

        .tempo {
            color: #55d66b;
            font-weight: bold;
        }

        .carregando {
            text-align: center;
            padding: 20px;
        }

        .erro {
            color: #ff7070;
            margin-top: 10px;
        }

        .botao {
            width: 100%;

            margin-top: 15px;

            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #5271ff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .opcao {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .opcao button {
            flex: 1;

            padding: 10px;

            border: 1px solid #333;
            border-radius: 9px;

            background: #1b1b1b;
            color: white;

            cursor: pointer;
        }

        .opcao button:hover {
            background: #5271ff;
        }

    </style>

</head>

<body>

    <div class="logo">
        🚌 BusReview
    </div>

    <button
        class="localizar"
        onclick="localizarUsuario()">

        📍

    </button>

    <div id="map"></div>

    <div
        id="painel"
        class="painel">

        <button
            class="fechar"
            onclick="fecharPainel()">

            ×

        </button>

        <div id="conteudo"></div>

    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        // ==========================================
        // MAPA
        // ==========================================

        const map = L.map("map");

        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
            {
                attribution:
                    '&copy; OpenStreetMap &copy; CARTO',

                subdomains: "abcd",

                maxZoom: 20
            }
        ).addTo(map);


        map.setView(
            [-23.7000, -46.7000],
            13
        );


        // ==========================================
        // VARIÁVEIS
        // ==========================================

        let marcadorUsuario = null;

        let circulo = null;

        let paradas = [];

        let localizacaoAtual = null;


        // ==========================================
        // LOCALIZAÇÃO
        // ==========================================

        function localizarUsuario() {

            if (!navigator.geolocation) {

                alert(
                    "Seu navegador não suporta localização."
                );

                return;
            }


            navigator.geolocation.watchPosition(

                function(position) {

                    const lat =
                        position.coords.latitude;

                    const lon =
                        position.coords.longitude;


                    localizacaoAtual = {
                        lat,
                        lon
                    };


                    mostrarUsuario(
                        lat,
                        lon
                    );

                },


                function(error) {

                    console.log(
                        "Erro GPS:",
                        error
                    );

                    alert(
                        "Permita o acesso à localização no navegador."
                    );

                },


                {
                    enableHighAccuracy: true,

                    maximumAge: 5000,

                    timeout: 15000
                }

            );

        }


        // ==========================================
        // MOSTRAR USUÁRIO
        // ==========================================

        function mostrarUsuario(
            lat,
            lon
        ) {

            if (marcadorUsuario) {

                map.removeLayer(
                    marcadorUsuario
                );

            }


            if (circulo) {

                map.removeLayer(
                    circulo
                );

            }


            marcadorUsuario =
                L.circleMarker(

                    [lat, lon],

                    {
                        radius: 9,

                        color: "white",

                        weight: 3,

                        fillColor: "#5271ff",

                        fillOpacity: 1
                    }

                ).addTo(map);


            marcadorUsuario.bindPopup(
                "<b>📍 Você está aqui</b>"
            );


            circulo =
                L.circle(

                    [lat, lon],

                    {
                        radius: 2000,

                        color: "#5271ff",

                        weight: 2,

                        fillColor: "#5271ff",

                        fillOpacity: 0.08
                    }

                ).addTo(map);


            map.setView(
                [lat, lon],
                14
            );


            carregarParadas(
                lat,
                lon
            );

        }


        // ==========================================
        // BUSCAR PARADAS NO BACKEND
        // ==========================================

        async function carregarParadas(
            lat,
            lon
        ) {

            try {

                const resposta =
                    await fetch(
                        `/api/paradas?lat=${lat}&lon=${lon}`
                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao buscar paradas"
                    );

                }


                const dados =
                    await resposta.json();


                mostrarParadas(
                    dados
                );


            }
            catch (erro) {

                console.error(
                    erro
                );

            }

        }


        // ==========================================
        // MOSTRAR PARADAS
        // ==========================================

        function mostrarParadas(
            dados
        ) {

            paradas.forEach(
                marker =>
                    map.removeLayer(marker)
            );


            paradas = [];


            dados.forEach(
                parada => {

                    const marker =
                        L.circleMarker(

                            [
                                parada.py,
                                parada.px
                            ],

                            {
                                radius: 8,

                                color: "white",

                                weight: 2,

                                fillColor: "#5271ff",

                                fillOpacity: 1
                            }

                        ).addTo(map);


                    marker.on(
                        "click",
                        function() {

                            abrirParada(
                                parada
                            );

                        }
                    );


                    paradas.push(
                        marker
                    );

                }
            );

        }


        // ==========================================
        // ABRIR PARADA
        // ==========================================

        async function abrirParada(
            parada
        ) {

            const painel =
                document.getElementById(
                    "painel"
                );


            const conteudo =
                document.getElementById(
                    "conteudo"
                );


            painel.style.display =
                "block";


            conteudo.innerHTML = `

                <h2>
                    🚌 ${escapeHtml(parada.np)}
                </h2>

                <p>
                    ${escapeHtml(
                        parada.ed || ""
                    )}
                </p>

                <div class="carregando">

                    ⏱️ Buscando
                    ônibus chegando...

                </div>

            `;


            try {

                const resposta =
                    await fetch(
                        `/api/previsao/${parada.cp}`
                    );


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.error ||
                        "Erro na SPTrans"
                    );

                }


                mostrarPrevisoes(
                    dados
                );


            }
            catch (erro) {

                console.error(
                    erro
                );


                conteudo.innerHTML += `

                    <p class="erro">

                        Não foi possível obter
                        a previsão desta parada.

                    </p>

                `;

            }

        }


        // ==========================================
        // MOSTRAR PREVISÕES
        // ==========================================

        function mostrarPrevisoes(
            dados
        ) {

            const conteudo =
                document.getElementById(
                    "conteudo"
                );


            if (
                !dados ||
                !dados.p ||
                !dados.p.l ||
                dados.p.l.length === 0
            ) {

                conteudo.innerHTML += `

                    <p>
                        Nenhum ônibus foi localizado
                        para previsão neste momento.
                    </p>

                `;

                return;

            }


            let html = `

                <h2>
                    🚌 ${escapeHtml(
                        dados.p.np
                    )}
                </h2>

                <p>
                    Atualizado às
                    ${escapeHtml(
                        dados.hr || "--:--"
                    )}
                </p>

            `;


            dados.p.l.forEach(
                linha => {

                    html += `

                        <div
                            class="linha"
                            onclick="
                                abrirLinha(
                                    '${escapeAttr(linha.c)}',
                                    '${escapeAttr(linha.lt0)}',
                                    ${linha.cl}
                                )
                            "
                        >

                            <b>
                                ${escapeHtml(
                                    linha.c
                                )}
                            </b>

                            <br>

                            → ${escapeHtml(
                                linha.lt0
                            )}

                            <br><br>

                    `;


                    if (
                        linha.vs &&
                        linha.vs.length > 0
                    ) {

                        linha.vs
                            .slice(0, 3)
                            .forEach(
                                veiculo => {

                                    html += `

                                        <span class="tempo">

                                            🟢
                                            ${tempoAte(
                                                veiculo.t
                                            )}

                                        </span>

                                        <br>

                                    `;

                                }
                            );

                    }
                    else {

                        html += `

                            <span>
                                Sem previsão disponível
                            </span>

                        `;

                    }


                    html += `

                        </div>

                    `;

                }
            );


            conteudo.innerHTML =
                html;

        }


        // ==========================================
        // CONVERTER HORÁRIO EM MINUTOS
        // ==========================================

        function tempoAte(
            horario
        ) {

            if (!horario) {

                return "horário indisponível";

            }


            const agora =
                new Date();


            const partes =
                horario.split(":");


            const chegada =
                new Date();


            chegada.setHours(
                Number(partes[0]),
                Number(partes[1]),
                0,
                0
            );


            let diferenca =
                Math.round(
                    (
                        chegada - agora
                    ) / 60000
                );


            if (diferenca < 0) {

                diferenca = 0;

            }


            if (diferenca === 0) {

                return "chegando agora";

            }


            return `chega em ${diferenca} min`;

        }


        // ==========================================
        // ABRIR LINHA
        // ==========================================

        function abrirLinha(
            codigo,
            destino,
            codigoLinha
        ) {

            const conteudo =
                document.getElementById(
                    "conteudo"
                );


            conteudo.innerHTML = `

                <h2>
                    🚌 ${escapeHtml(codigo)}
                </h2>

                <p>

                    <b>
                        Destino:
                    </b>

                    ${escapeHtml(destino)}

                </p>

                <p
                    style="margin-top:10px"
                >

                    Código SPTrans:
                    ${codigoLinha}

                </p>

                <p
                    style="margin-top:10px"
                >

                    🟢 Dados obtidos
                    da SPTrans Olho Vivo

                </p>

                <button
                    class="botao"
                    onclick="
                        abrirAvaliacao(
                            '${escapeAttr(codigo)}'
                        )
                    "
                >

                    ⭐ Avaliar viagem

                </button>

            `;

        }


        // ==========================================
        // AVALIAÇÃO
        // ==========================================

        let avaliacao = {};


        function abrirAvaliacao(
            codigo
        ) {

            const conteudo =
                document.getElementById(
                    "conteudo"
                );


            conteudo.innerHTML = `

                <h2>
                    ⭐ Avaliar ${escapeHtml(codigo)}
                </h2>

                <p>
                    Como estava o ônibus?
                </p>

                <div class="opcao">

                    <button
                        onclick="
                            selecionar(
                                'lotacao',
                                'Normal'
                            )
                        "
                    >
                        🟢 Normal
                    </button>

                    <button
                        onclick="
                            selecionar(
                                'lotacao',
                                'Cheio'
                            )
                        "
                    >
                        🟡 Cheio
                    </button>

                    <button
                        onclick="
                            selecionar(
                                'lotacao',
                                'Muito cheio'
                            )
                        "
                    >
                        🔴 Muito cheio
                    </button>

                </div>


                <br>


                <p>
                    Você conseguiu embarcar?
                </p>


                <div class="opcao">

                    <button
                        onclick="
                            selecionar(
                                'embarque',
                                'Sim'
                            )
                        "
                    >
                        Sim
                    </button>


                    <button
                        onclick="
                            selecionar(
                                'embarque',
                                'Não'
                            )
                        "
                    >
                        Não
                    </button>

                </div>


                <br>


                <p>
                    Houve atraso?
                </p>


                <div class="opcao">

                    <button
                        onclick="
                            selecionar(
                                'atraso',
                                'Não'
                            )
                        "
                    >
                        Não
                    </button>


                    <button
                        onclick="
                            selecionar(
                                'atraso',
                                'Sim'
                            )
                        "
                    >
                        Sim
                    </button>

                </div>


                <button
                    class="botao"
                    onclick="
                        enviarAvaliacao()
                    "
                >

                    Enviar avaliação

                </button>

            `;

        }


        function selecionar(
            tipo,
            valor
        ) {

            avaliacao[tipo] =
                valor;

        }


        function enviarAvaliacao() {

            if (
                !avaliacao.lotacao ||
                !avaliacao.embarque ||
                !avaliacao.atraso
            ) {

                alert(
                    "Responda todas as perguntas."
                );

                return;

            }


            alert(
                "Avaliação enviada!"
            );


            avaliacao = {};

            fecharPainel();

        }


        // ==========================================
        // FECHAR
        // ==========================================

        function fecharPainel() {

            document.getElementById(
                "painel"
            ).style.display =
                "none";

        }


        // ==========================================
        // SEGURANÇA
        // ==========================================

        function escapeHtml(
            texto
        ) {

            return String(texto || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        function escapeAttr(
            texto
        ) {

            return String(texto || "")
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'");

        }


        // ==========================================
        // INICIAR
        // ==========================================

        localizarUsuario();

    </script>

</body>

</html>
