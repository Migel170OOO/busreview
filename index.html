<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusSul</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // ==========================================
    // ZONA SUL DE SÃO PAULO
    // ==========================================

    const limiteZonaSul = [
        [-23.85, -46.85],
        [-23.45, -46.50]
    ];


    // ==========================================
    // CRIA O MAPA
    // ==========================================

    const map = L.map("map", {

        // Não deixa sair da região
        maxBounds: limiteZonaSul,

        maxBoundsViscosity: 1.0,

        // NÃO permite diminuir até aparecer o Brasil
        minZoom: 12,

        maxZoom: 18

    });


    // ==========================================
    // MAPA
    // ==========================================

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    // ==========================================
    // CENTRO DA ZONA SUL
    // ==========================================

    map.setView(
        [-23.7000, -46.7000],
        12
    );


    // ==========================================
    // MARCADOR DE INTERLAGOS
    // ==========================================

    L.marker([-23.7000, -46.7000])
        .addTo(map)
        .bindPopup(
            "<b>🚌 Interlagos</b><br>Zona Sul de São Paulo"
        );

</script>

</body>
</html>
