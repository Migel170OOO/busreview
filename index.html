<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa - Zona Sul SP</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // Limites aproximados da Zona Sul de São Paulo
    const zonaSul = [
        [-23.85, -46.85], // Sul / Oeste
        [-23.45, -46.50]  // Norte / Leste
    ];

    // Cria o mapa
    const map = L.map("map", {
        maxBounds: zonaSul,
        maxBoundsViscosity: 1.0,
        minZoom: 11,
        maxZoom: 18
    });

    // Mapa
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    // Enquadra a Zona Sul
    map.fitBounds(zonaSul);

</script>

</body>
</html>
