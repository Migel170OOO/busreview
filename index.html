<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusReview</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            🚌 BusReview
        </div>
    </header>

    <main>

        <section class="hero">

            <h1>Para onde você quer ir?</h1>

            <p>
                Encontre linhas, acompanhe ônibus
                e avalie sua viagem.
            </p>

            <div class="destinos">

                <button onclick="buscarDestino('Casa')">
                    🏠
                    <span>Casa</span>
                </button>

                <button onclick="buscarDestino('Escola')">
                    🏫
                    <span>Escola</span>
                </button>

                <button onclick="buscarDestino('Trabalho')">
                    💼
                    <span>Trabalho</span>
                </button>

                <button onclick="buscarDestino('Outro')">
                    ➕
                    <span>Outro</span>
                </button>

            </div>

        </section>


        <section class="map-container">

            <div id="map"></div>

        </section>


        <section class="linhas">

            <h2>Linhas próximas</h2>

            <div id="listaLinhas"></div>

        </section>


        <section
            id="detalhes"
            class="detalhes"
        >

            <button
                class="voltar"
                onclick="fecharDetalhes()"
            >
                ← Voltar
            </button>

            <h2 id="linhaNome">
                Linha
            </h2>

            <div
                id="linhaStatus"
                class="status"
            >
            </div>

            <div class="informacoes">

                <div class="info">

                    <small>
                        Próximo ônibus
                    </small>

                    <strong id="tempo">
                        -
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Confiabilidade
                    </small>

                    <strong id="confiabilidade">
                        -
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Lotação
                    </small>

                    <strong id="lotacao">
                        -
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Horário de pico
                    </small>

                    <strong>
                        06:40 – 08:10
                    </strong>

                </div>

            </div>


            <div class="avaliacao">

                <h3>
                    Como foi sua viagem?
                </h3>

                <div class="estrelas">

                    <button onclick="avaliar(1)">
                        ★
                    </button>

                    <button onclick="avaliar(2)">
                        ★
                    </button>

                    <button onclick="avaliar(3)">
                        ★
                    </button>

                    <button onclick="avaliar(4)">
                        ★
                    </button>

                    <button onclick="avaliar(5)">
                        ★
                    </button>

                </div>

                <p id="mensagemAvaliacao"></p>

            </div>

        </section>

    </main>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="app.js"></script>

</body>
</html>
